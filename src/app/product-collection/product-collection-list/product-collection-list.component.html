<section class="section-pagetop bg breadcrumb-wrapper">
    <div class="container">
        <div class="row">
            <app-breadcrumb></app-breadcrumb>
        </div>
        
    </div> <!-- container //  -->
</section>
<section class="banner-image" *ngIf="collection.banner_image">
    <div class="container-fluid p-0">
        <div class="row no-gutters">
            <div *ngIf="collection.banner_image" class="category-banner mb-2 col-12">
                <img [src]="collection.banner_image" class="img-fluid" alt="">
            </div>
        </div>
    </div>
</section>
<section class="main-content pt-2 pb-5">
    <div class="container">
        <div class="row no-gutters">
            
            <main class="content category-details col-12">
                                
                <div class="inner-content card-body">
                    <div class="row justify-content-between">
                        <div class="filter-icon">
                            <!-- <a (click)="mobileFilter()">
                                <img src="assets/images/icons/png/50/slider.png" class="icon-slider"/>
                            </a> -->
                        </div>
                        <div class="category-title pl-3">
                            <h1 class="h4">{{ collection.name }}</h1>
                        </div>
                        <div class="form-inline d-inline-flex float-right sort-filter">
                            <!-- <select #sortFilter (change)='onOptionsSelected(sortFilter.value)' class="mr-2 form-control sort-by">
                                <option >Sort by</option>
                                <option value="name_asc">Name (A - Z)</option>
                                <option value="name_desc">Name (Z - A)</option>
                                <option value="price_asc">Price (Low > High)</option>
                                <option value="price_desc">Price (High > Low)</option>
                            </select> -->
                        </div>
                       
                    </div>
                    <!-- <div class="row mt-2" *ngIf="selectedCategoryDetail.description">                        
                        <div class="category-desc px-3 text-justify" [innerHTML]="selectedCategoryDetail.description | sanitizeHtml">
                        </div>
                    </div> -->
                   
                    <div class="row">                        
                        <!-- col.// -->
                        <div class="col-md-8">
                            
                        </div> <!-- col.// -->
                    </div> <!-- row.// -->
                   
                    <div class="row mt-3">
                        <div class="col-6 col-sm-4 col-md-4 col-lg-2" *ngFor="let product of products | paginate : {
							itemsPerPage: pageSize,
							currentPage: page,
							totalItems: count
							};">
                            <app-product-card [product]="product" [contentLoaded]="isLoading"></app-product-card>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-12">
                            <div class="float-right">
                                 <pagination-controls previousLabel="Prev" nextLabel="Next"
                                (pageChange)="handlePageChange($event)" responsive="true"></pagination-controls>
                            </div>                           
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</section>
